<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="580" height="220" role="img" aria-labelledby="title desc">
  <title id="title">sshelf</title>
  <desc id="desc">An elf holding an SSH key next to a shelf of servers, beside the word sshelf.</desc>

