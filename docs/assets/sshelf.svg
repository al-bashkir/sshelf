  <path d="M258 130 L272 130 L258 144 Z" fill="#8b5a2b"/>
  <path d="M530 130 L516 130 L530 144 Z" fill="#8b5a2b"/>
  <text x="252" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">a shelf for your SSH hosts</text>
